name: Prices

# The weekly checkpoint.
#
# This is not a Vercel cron, for the alert. A failed workflow emails
# you, which is what a job whose failure mode is silence has been
# missing; a Vercel cron that stops running tells nobody. It also
# sidesteps Hobby's daily-only cron schedules, should this ever want a
# different clock.
#
# Daily rather than weekly, because what gets recorded is decided by the
# round's own clock: the baseline is the price at the lock, and the lock
# is rarely a Monday. The app writes only the checkpoint it is standing
# in, and only when that one is still empty, so a daily run records
# nothing extra — it just means the baseline lands within a day of the
# lock instead of drifting to the next Monday.
#
# Needs two secrets: SITE_URL and CRON_SECRET (matching Vercel's). The
# price source needs no key.

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

# Two runs at once would both see the same checkpoint empty and both try
# to fill it. The second is harmless — the app ignores a quote for
# something already recorded — but there is no reason to pay for it.
concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch and record
    runs-on: ubuntu-latest
    # Generous. One request per symbol with a short pause between them
    # is seconds, not minutes, but a retry against a throttled feed can
    # stretch it and a hung run should end by itself.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No install: the script is plain node with global fetch.
      - name: Fetch prices
        run: node scripts/fetch-prices.mjs
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
